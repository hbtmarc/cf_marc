<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CFMarc</title>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header__marca">
        <i class="ph ph-wallet header__logo" aria-hidden="true"></i>
        <span class="header__nome">CFMarc</span>
      </div>

      <nav class="header__nav" aria-label="Navegação principal">
        <ul class="nav__lista">
          <li>
            <a href="#/dashboard" class="nav__link" data-route="dashboard" aria-label="Dashboard">
              <i class="ph ph-house nav__icone" aria-hidden="true"></i>
              <span class="nav__rotulo" aria-hidden="true">Dashboard</span>
            </a>
          </li>
          <li>
            <a href="#/importar" class="nav__link" data-route="importar" aria-label="Importar arquivo financeiro">
              <i class="ph ph-plus-circle nav__icone" aria-hidden="true"></i>
              <span class="nav__rotulo" aria-hidden="true">Importar</span>
            </a>
          </li>
          <li>
            <a href="#/balanco" class="nav__link" data-route="balanco" aria-label="Balanço">
              <i class="ph ph-chart-line-up nav__icone" aria-hidden="true"></i>
              <span class="nav__rotulo" aria-hidden="true">Balanço</span>
            </a>
          </li>
          <li>
            <a href="#/cartoes" class="nav__link" data-route="cartoes" aria-label="Cartões">
              <i class="ph ph-credit-card nav__icone" aria-hidden="true"></i>
              <span class="nav__rotulo" aria-hidden="true">Cartões</span>
            </a>
          </li>
          <li>
            <a href="#/configuracoes" class="nav__link" data-route="configuracoes" aria-label="Configurações">
              <i class="ph ph-gear nav__icone" aria-hidden="true"></i>
              <span class="nav__rotulo" aria-hidden="true">Configurações</span>
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main id="conteudo" class="conteudo" role="main">
      <!-- Conteúdo renderizado pelo app.js -->
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
